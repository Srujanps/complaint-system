# Server Configuration
server.port=8080

# Database Configuration
# Use environment variables from Docker, fallback to localhost for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grievance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vikas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
#spring.datasource.url = jdbc:postgresql://localhost:5432/grievance_db
#spring.datasource.username = postgres
#spring.datasource.password = 2005

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.project.Complaint.system=DEBUG
logging.level.com.grievance.ai=DEBUG

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}