<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../commons/ui_utils.css">
    <link rel="stylesheet" href="../commons/navbar.css">
</head>
<body class="bg-light">

    <div id="navbar-placeholder"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0" data-i18n-key="admin_users_title">System Users</h4>
            <button class="btn btn-primary btn-sm" onclick="openAddUserModal()"><i class="bi bi-person-plus-fill me-1"></i> Add User</button>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-0 py-3">
                <h6 class="mb-0 fw-bold">All Registered Users</h6>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light text-muted">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Username</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th class="text-end pe-4">Action</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="7" class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Add New User</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addUserForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Role</label>
                            <select class="form-select" id="newRole" required onchange="toggleRepFields()">
                                <option value="">Select Role</option>
                                <option value="CITIZEN">Citizen</option>
                                <option value="VENDOR">Field Vendor</option>
                                <option value="OFFICER">Officer</option>
                                <option value="REPRESENTATIVE">Representative (MLA/MP)</option>
                                <option value="ADMIN">Admin</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Username</label>
                                <input type="text" class="form-control" id="newUsername" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control" id="newPassword" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Full Name</label>
                                <input type="text" class="form-control" id="newFullName" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Phone</label>
                                <input type="text" class="form-control" id="newPhone" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" id="newEmail" required>
                        </div>
                        <!-- Representative specific fields -->
                        <div id="repFields" style="display: none; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed #5c35cc;">
                            <div class="mb-3">
                                <label class="form-label fw-bold" style="color: #5c35cc">Constituency / Area</label>
                                <input type="text" class="form-control" id="newConstituency" placeholder="e.g. Ward 12, Baner">
                            </div>
                            <div class="mb-0">
                                <label class="form-label fw-bold" style="color: #5c35cc">Designation</label>
                                <input type="text" class="form-control" id="newDesignation" placeholder="e.g. MLA, Ward Councilor">
                            </div>
                        </div>

                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Create User</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="../commons/ai_assistant.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../commons/ui_utils.js"></script>
    <script src="../commons/API.js"></script>
    <script src="../commons/i18n.js"></script>
    <script src="../commons/navbar.js"></script>
    <script src="../commons/ai_assistant.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
