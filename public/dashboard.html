<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Complaint Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="commons/ui_utils.css">
    <link rel="stylesheet" href="commons/navbar.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .dashboard-container {
            padding: 2rem 0;
            flex: 1;
        }

        .stats-card {
            background: white;
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            padding: 1rem;
            height: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stats-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
        }

        .stats-title {
            color: #6c757d;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .stats-value {
            color: #121212;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0;
        }

        .stats-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 0.75rem;
        }

        .chart-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            padding: 1.5rem;
            height: 400px;
            display: flex;
            flex-direction: column;
        }

        .chart-card h5 {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: #121212;
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }
    </style>
</head>
<body>
    
    <!-- Navbar Container -->
    <div id="navbar-placeholder"></div>

    <div class="container dashboard-container">
        <!-- Welcome Section -->
        <div class="row mb-4">
            <div class="col-12">
                <h3 style="font-weight: 700; color: #121212;" id="welcomeTitle" data-i18n-key="dashboard_title">Dashboard</h3>
                <p class="text-muted" id="welcomeSubtitle" data-i18n-key="dashboard_welcome">Welcome to your grievance management overview.</p>
            </div>
        </div>

        <!-- Dynamic Dashboard UI mounts here -->
        <div id="dashboardContent">
            <!-- Loading indicator -->
            <div class="text-center my-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>

        <div id="chartsContainer" class="row g-4 mt-1" style="display: none;">
            <div class="col-md-8">
                <div class="chart-card">
                    <h5>Complaint Activity</h5>
                    <div class="chart-container">
                        <canvas id="activityChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="chart-card">
                    <h5>Status Distribution</h5>
                    <div class="chart-container">
                        <canvas id="distChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="commons/ai_assistant.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="commons/ui_utils.js"></script>
    <script src="commons/API.js"></script>
    <script src="commons/i18n.js"></script>
    <script src="commons/navbar.js"></script>
    <script src="commons/ai_assistant.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
