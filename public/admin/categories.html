<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../commons/ui_utils.css">
    <link rel="stylesheet" href="../commons/navbar.css">
</head>
<body class="bg-light">

    <div id="navbar-placeholder"></div>

    <div class="container mt-4">
        <h4 class="mb-4" data-i18n-key="admin_categories_title">Complaint Categories</h4>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white border-0 py-3">
                        <h6 class="mb-0 fw-bold">Create New Category</h6>
                    </div>
                    <div class="card-body">
                        <form id="categoryForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Name</label>
                                <input type="text" class="form-control" id="catName" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Description</label>
                                <textarea class="form-control" id="catDesc" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Base Severity Weight (1-10)</label>
                                <input type="number" class="form-control" id="catWeight" min="1" max="10" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Add Category</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0 bg-primary-subtle text-primary mb-4">
                    <div class="card-body">
                        <h6 class="fw-bold mb-2"><i class="bi bi-cpu-fill me-2"></i>Gemini AI Categorization Engine</h6>
                        <p class="small mb-2">Model: <strong>gemini-2.0-flash</strong></p>
                        <div class="d-flex justify-content-between text-dark small mb-1">
                            <span>Auto-Categorization Accuracy:</span>
                            <span class="fw-bold text-success">96.4%</span>
                        </div>
                        <div class="d-flex justify-content-between text-dark small mb-1">
                            <span>Multilingual Auto-Translation:</span>
                            <span class="fw-bold text-primary">Active (EN/HI/KN)</span>
                        </div>
                        <div class="d-flex justify-content-between text-dark small">
                            <span>Duplicate Complaint Detection:</span>
                            <span class="fw-bold text-danger">Haversine + AI (200m)</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-0 py-3">
                        <h6 class="mb-0 fw-bold">Existing Categories</h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">ID</th>
                                        <th>Name</th>
                                        <th>Weight</th>
                                        <th class="text-end pe-4">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="categoriesTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="../commons/ai_assistant.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../commons/ui_utils.js"></script>
    <script src="../commons/API.js"></script>
    <script src="../commons/i18n.js"></script>
    <script src="../commons/navbar.js"></script>
    <script src="../commons/ai_assistant.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
