<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        :root {
            --primary-orange: #FF6F00;
            --dark-black: #121212;
            --off-white: #f8f9fa;
        }

        body {
            background-color: var(--off-white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            text-align: center;
            padding: 20px;
        }

        .landing-card {
            background-color: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .logo-img {
            max-width: 180px;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--dark-black);
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            color: #6c757d;
            margin-bottom: 2rem;
        }

        .btn-custom {
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 1rem;
        }

        .btn-primary-custom {
            background-color: var(--primary-orange);
            color: white;
            border: none;
        }

        .btn-primary-custom:hover {
            background-color: #E65100;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 111, 0, 0.3);
        }

        .btn-outline-custom {
            border: 2px solid var(--primary-orange);
            color: var(--primary-orange);
            background-color: transparent;
        }

        .btn-outline-custom:hover {
            background-color: var(--primary-orange);
            color: white;
            transform: translateY(-2px);
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="commons/ui_utils.css">
    <link rel="stylesheet" href="commons/ai_assistant.css">
</head>

<body>
    <div class="position-absolute top-0 end-0 p-3">
        <div class="d-flex align-items-center gap-1 bg-white px-2 py-1 rounded border shadow-sm">
            <i class="bi bi-translate text-primary fs-6"></i>
            <select id="indexLangSelect" class="form-select form-select-sm border-0 bg-transparent fw-semibold i18n-lang-select" onchange="window.i18n ? window.i18n.setLanguage(this.value) : localStorage.setItem('preferred_language', this.value);" aria-label="Select Language">
                <option value="en">English</option>
                <option value="kn">ಕನ್ನಡ</option>
                <option value="hi">हिंदी</option>
                <option value="te">తెలుగు</option>
                <option value="ta">தமிழ்</option>
            </select>
        </div>
    </div>

    <div class="landing-card">
        <img src="assets/logo.png" alt="Complaint System Logo" class="logo-img">
        <h1 data-i18n-key="nav_welcome">Welcome</h1>
        <p data-i18n-key="login_subtitle">A smart, streamlined platform for submitting, tracking, and resolving civic complaints effectively.</p>
        <a href="login.html" class="btn btn-custom btn-primary-custom" data-i18n-key="login_button">Log In</a>
        <a href="signup.html" class="btn btn-custom btn-outline-custom" data-i18n-key="sign_up_link">Create an Account</a>
    </div>

    <script src="commons/API.js"></script>
    <script src="commons/ui_utils.js"></script>
    <script src="commons/i18n.js"></script>
    <script src="commons/ai_assistant.js"></script>
</body>

</html>
