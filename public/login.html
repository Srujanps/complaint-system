<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="portalTitle">Civic Grievance System - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="commons/ui_utils.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-accent: #FF6F00;
            --primary-gradient: linear-gradient(135deg, #FF6F00 0%, #FF9100 100%);
            --dark-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.92);
            --border-color: rgba(226, 232, 240, 0.8);
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
            margin: 0;
            color: #1e293b;
        }

        /* Top Brand Navigation Bar */
        .app-nav-bar {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.85rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            height: 38px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(255, 111, 0, 0.4));
        }

        .brand-text {
            font-weight: 700;
            font-size: 1.15rem;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .brand-badge {
            background: rgba(255, 111, 0, 0.15);
            color: #ff9100;
            border: 1px solid rgba(255, 111, 0, 0.3);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
        }

        /* Language Selector Pill */
        .lang-switcher-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 6px 14px;
            border-radius: 30px;
            transition: all 0.25s ease;
        }

        .lang-switcher-pill:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 111, 0, 0.4);
        }

        .lang-select-dropdown {
            background: transparent;
            color: #ffffff;
            border: none;
            outline: none;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
        }

        .lang-select-dropdown option {
            background: #1e293b;
            color: #ffffff;
        }

        /* Login Layout */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.25rem;
            position: relative;
        }

        /* Ambient Glow Background Orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: #ff6f00;
            top: 10%;
            left: 15%;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        .orb-2 {
            width: 550px;
            height: 550px;
            background: #3b82f6;
            bottom: 10%;
            right: 15%;
            animation: pulseGlow 10s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.2; }
            100% { transform: scale(1.15) translate(20px, -20px); opacity: 0.35; }
        }

        /* Modern Glass Card */
        .modern-login-card {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            max-width: 440px;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card-top-header {
            text-align: center;
            padding: 2.5rem 2rem 1.25rem 2rem;
        }

        .card-body-content {
            padding: 0 2rem 2.5rem 2rem;
        }

        .form-label {
            font-size: 0.88rem;
            color: #334155;
            margin-bottom: 0.4rem;
        }

        .input-group-text {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            color: #64748b;
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.78rem 1rem;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
            background-color: #ffffff;
        }

        .form-control:focus {
            border-color: #ff6f00;
            box-shadow: 0 0 0 0.25rem rgba(255, 111, 0, 0.2);
        }

        .btn-submit-primary {
            background: var(--primary-gradient);
            border: none;
            color: #ffffff;
            border-radius: 12px;
            padding: 0.85rem;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            margin-top: 1.25rem;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(255, 111, 0, 0.35);
        }

        .btn-submit-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 111, 0, 0.45);
        }

        .signup-prompt-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.92rem;
            color: #64748b;
        }

        .signup-prompt-footer a {
            color: #ff6f00;
            text-decoration: none;
            font-weight: 700;
        }

        .signup-prompt-footer a:hover {
            text-decoration: underline;
        }

        .app-footer {
            background: rgba(15, 23, 42, 0.9);
            color: #64748b;
            font-size: 0.82rem;
            text-align: center;
            padding: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

<body>

    <!-- Header Navigation Bar -->
    <header class="app-nav-bar">
        <div class="brand-container">
            <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
                <img src="assets/logo.png" alt="Logo" class="brand-logo">
                <span class="brand-text" data-i18n-key="nav_portal_title">Grievance Hub</span>
            </a>
        </div>
        <div class="d-flex align-items-center gap-1 bg-white px-2 py-1 rounded border shadow-sm">
            <i class="bi bi-translate text-primary fs-6"></i>
            <select id="appLangSelect" class="form-select form-select-sm border-0 bg-transparent fw-semibold i18n-lang-select" onchange="window.i18n ? window.i18n.setLanguage(this.value) : localStorage.setItem('preferred_language', this.value);" aria-label="Select Language">
                <option value="en">English</option>
                <option value="kn">ಕನ್ನಡ</option>
                <option value="hi">हिंदी</option>
                <option value="te">తెలుగు</option>
                <option value="ta">தமிழ்</option>
            </select>
        </div>
    </header>

    <div class="login-container">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>

        <div class="card modern-login-card">
            <div class="card-top-header">
                <h4 class="fw-bold mb-1" style="color: #0f172a;" data-i18n-key="login_header">Sign In to Your Account</h4>
                <p class="text-muted small mb-0" data-i18n-key="login_subtitle">Access civic grievance portal services & track status</p>
            </div>
            <div class="card-body-content">
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold" data-i18n-key="username_label">Username, Email, or Mobile Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control" id="username" data-i18n-key="username_placeholder" placeholder="Enter username, email, or mobile number" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold" data-i18n-key="password_label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="password" data-i18n-key="password_placeholder" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-submit-primary" id="loginBtn">
                        <i class="bi bi-box-arrow-in-right me-2"></i><span data-i18n-key="login_button">Log In</span>
                    </button>
                </form>

                <div class="signup-prompt-footer">
                    <p class="mb-0"><span data-i18n-key="no_account_text">Don't have an account?</span> <a href="signup.html" data-i18n-key="sign_up_link">Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>

    <footer class="app-footer">
        © 2026 Civic Grievance System | Civic Redressal Platform
    </footer>

    <!-- Scripts -->
    <link rel="stylesheet" href="commons/ai_assistant.css">
    <script src="commons/API.js"></script>
    <script src="commons/ui_utils.js"></script>
    <script src="commons/i18n.js"></script>
    <script src="commons/ai_assistant.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
